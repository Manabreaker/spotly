[project]
name = "spotly"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
 "fastapi>=0.119", "uvicorn[standard]>=0.37", "sqlalchemy[asyncio]>=2.0,<2.1",
 "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2", "pydantic-settings>=2.10",
 "jinja2>=3.1", "python-multipart>=0.0.20", "pillow>=12", "pillow-heif>=1",
 "tzdata"
]
[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "ruff>=0.13",
    "httpx2>=2.13.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
