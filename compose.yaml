name: spotly
services:
  db:
    image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: spotly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d spotly"]
      interval: 5s
      timeout: 3s
      retries: 20
    shm_size: 128mb
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  app:
    build: .
    image: spotly-app:${APP_REVISION:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/spotly
      DATA_DIR: /app/data
      APP_REVISION: ${APP_REVISION:-local}
    volumes:
      - ./data/photos:/app/data/photos
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  caddy:
    image: caddy:2@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
